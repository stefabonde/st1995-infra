# Zona condivisa per il rate-limiting sugli endpoint di login (contro brute-force).
# 5 richieste/minuto per IP, con burst di 3 per non penalizzare un utente che
# sbaglia la password un paio di volte di fretta.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Pagine pubbliche di manualsweb (PDF, etichette, SQLite): 20 richieste/minuto per IP
limit_req_zone $binary_remote_addr zone=pubdocs:10m rate=20r/m;
# Download pacchetto offline (genera uno zip da ~100MB a ogni richiesta): 3 richieste/minuto per IP
limit_req_zone $binary_remote_addr zone=offline:10m rate=3r/m;
