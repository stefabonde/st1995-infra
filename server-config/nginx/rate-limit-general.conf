# Limite generale di richieste per IP su TUTTI i siti (http context).
# 8 richieste/s sostenute, con picchi fino a +150 (un caricamento pagina con asset ne fa decine).
# Le location con un proprio limit_req (login, pdf/etichette, offline) usano quello, piu stretto.
# Le richieste oltre il limite ricevono 429 e finiscono nel log errori: il jail fail2ban
# nginx-limit-req banna chi insiste (10 errori in 5 minuti).
limit_req_zone $binary_remote_addr zone=general:20m rate=8r/s;
limit_req zone=general burst=150 nodelay;
limit_req_status 429;

# Connessioni simultanee per IP (protegge da aperture massive di connessioni)
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn perip 60;
limit_conn_status 429;
