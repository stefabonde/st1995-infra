# Override di disk_space_usage: avviso al 80%, critico al 90% (default 90/98).
    template: disk_space_usage
          on: disk.space
       class: Utilization
        type: System
   component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* !HarddiskVolume* *
        calc: $used * 100 / ($avail + $used)
       units: %
       every: 1m
        warn: $this > (($status >= $WARNING ) ? (75) : (80))
        crit: $this > (($status == $CRITICAL) ? (85) : (90))
       delay: up 1m down 15m multiplier 1.5 max 1h
     summary: Disk ${label:mount_point} space usage
        info: Total space utilization of disk ${label:mount_point}
          to: sysadmin
