# Override di ram_in_use e 10min_cpu_usage (solo Linux): avviso al 70%, critico al 90%.
      alarm: ram_in_use
         on: system.ram
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $used * 100 / ($used + $cached + $free + $buffers)
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (65) : (70))
       crit: $this > (($status == $CRITICAL) ? (85) : (90))
      delay: down 15m multiplier 1.5 max 1h
    summary: System memory utilization
       info: System memory utilization
         to: sysadmin

   template: 10min_cpu_usage
         on: system.cpu
      class: Utilization
       type: System
  component: CPU
host labels: _os=linux
     lookup: average -10m unaligned of user,system,softirq,irq,guest
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING)  ? (65) : (70))
       crit: $this > (($status == $CRITICAL) ? (85) : (90))
      delay: down 15m multiplier 1.5 max 1h
    summary: System CPU utilization
       info: Average CPU utilization over the last 10 minutes (excluding iowait, nice and steal)
         to: sysadmin
